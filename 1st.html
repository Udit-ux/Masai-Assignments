<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create and Remove Paragraphs</title>
  <style>
    #paragraph-container {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 50px;
    }

    button {
      margin-right: 10px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <h1>Paragraph Creator</h1>

  <!-- Buttons to add and remove paragraphs -->
  <button id="addBtn">Add Paragraph</button>
  <button id="removeBtn">Remove Last Paragraph</button>

  <!-- Container where paragraphs will be added -->
  <div id="paragraph-container"></div>

  <!-- External JS -->
  <script src="script1.js"></script>
</body>
</html>
