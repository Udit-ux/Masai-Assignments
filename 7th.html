<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student CRUD App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { padding: 20px; }
    .loading { color: blue; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Student Manager (MockAPI)</h2>

  <form id="studentForm" class="mb-4">
    <input type="text" id="name" placeholder="Name" required class="form-control mb-2">
    <input type="number" id="age" placeholder="Age" required class="form-control mb-2">
    <input type="text" id="course" placeholder="Course" required class="form-control mb-2">
    <button class="btn btn-primary">Add Student</button>
  </form>

  <div id="loading" class="loading" style="display:none;">Loading...</div>
  <div id="error" class="text-danger"></div>

  <h4>Students:</h4>
  <div id="studentsList" class="row row-cols-1 row-cols-md-2 g-4"></div>

<script>
const BASE_URL = 'https://YOUR_API_URL/students';
let editId = null;

const loading = document.getElementById('loading');
const error = document.getElementById('error');

document.getElementById('studentForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const age = parseInt(document.getElementById('age').value);
  const course = document.getElementById('course').value.trim();

  if (!name || !course || isNaN(age)) {
    error.textContent = 'All fields are required and age must be a number.';
    return;
  }

  error.textContent = '';
  loading.style.display = 'block';

  try {
    if (editId) {
      await fetch(`${BASE_URL}/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, age, course })
      });
      editId = null;
    } else {
      await fetch(BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, age, course })
      });
    }

    e.target.reset();
    fetchStudents();
  } catch (err) {
    error.textContent = 'Failed to save student.';
  } finally {
    loading.style.display = 'none';
  }
});

async function fetchStudents() {
  loading.style.display = 'block';
  try {
    const res = await fetch(BASE_URL);
    const students = await res.json();
    renderStudents(students);
  } catch (err) {
    error.textContent = 'Failed to load students.';
  } finally {
    loading.style.display = 'none';
  }
}

function renderStudents(students) {
  const container = document.getElementById('studentsList');
  container.innerHTML = '';

  students.forEach(student => {
    const card = document.createElement('div');
    card.className = 'col';

    card.innerHTML = `
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">${student.name}</h5>
          <p class="card-text">Age: ${student.age}</p>
          <p class="card-text">Course: ${student.course}</p>
          <button class="btn btn-sm btn-warning" onclick="editStudent(${student.id}, '${student.name}', ${student.age}, '${student.course}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

function editStudent(id, name, age, course) {
  document.getElementById('name').value = name;
  document.getElementById('age').value = age;
  document.getElementById('course').value = course;
  editId = id;
}

async function deleteStudent(id) {
  loading.style.display = 'block';
  try {
    await fetch(`${BASE_URL}/${id}`, { method: 'DELETE' });
    fetchStudents();
  } catch (err) {
    error.textContent = 'Failed to delete student.';
  } finally {
    loading.style.display = 'none';
  }
}

// Initial load
fetchStudents();
</script>

</body>
</html>
