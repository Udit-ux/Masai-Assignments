<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fake Store Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .product-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .total {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Fake Store Products</h1>
  <div id="error" class="error"></div>
  <div id="product-grid" class="grid"></div>
  <div id="total-price" class="total"></div>

  <script>
    // Function to fetch and display products
    async function fetchProducts() {
      const grid = document.getElementById("product-grid");
      const errorDiv = document.getElementById("error");
      const totalPriceDiv = document.getElementById("total-price");

      try {
        const response = await fetch("https://fakestoreapi.com/products");
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        const products = await response.json();

        // Clear error if any
        errorDiv.textContent = "";

        // Display products
        products.forEach(product => {
          const card = document.createElement("div");
          card.className = "product-card";

          card.innerHTML = `
            <img src="${product.image}" alt="${product.title}" />
            <h3>${product.title}</h3>
            <p>Price: $${product.price}</p>
            <button>View Details</button>
          `;
          grid.appendChild(card);
        });

        // ✅ Calculate total price using reduce
        const totalPrice = products.reduce((sum, product) => {
          return sum + product.price;
        }, 0);

        totalPriceDiv.textContent = `Total Price of All Products: $${totalPrice.toFixed(2)}`;

        // Log products in console too (as per requirement)
        console.log("Fetched Products:", products);

      } catch (error) {
        // Handle error gracefully
        errorDiv.textContent = "Failed to fetch products. Please try again later.";
        console.error("Fetch Error:", error);
      }
    }

    // Invoke the function
    fetchProducts();
  </script>

</body>
</html>
