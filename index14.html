<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add List Items</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .odd {
      font-weight: bold;
      color: blue;
    }
    .even {
      font-style: italic;
      color: red;
    }
  </style>
</head>
<body>

  <h1>Dynamic List</h1>

  <ul id="item-list">
    <li class="odd">Item 1</li>
    <li class="even">Item 2</li>
    <li class="odd">Item 3</li>
  </ul>

  <button id="add-btn">Add Item</button>

  <script src="script.js"></script>

</body>
</html>
