<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styling with Class Selectors</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <p class="highlight">This is the first paragraph with a yellow background and bold text.</p>
    <p class="note">This is the second paragraph styled with italic text and dark green color.</p>
    <p>This is the third paragraph with default styling applied to all paragraphs.</p>
</body>
</html>
