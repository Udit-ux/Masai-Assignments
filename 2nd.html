<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Traversal</title>
  <style>
    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      margin: 5px;
      cursor: pointer;
      padding: 6px;
      border: 1px solid gray;
      width: 100px;
    }
  </style>
</head>
<body>

  <!-- Container and List Structure -->
  <div id="container">
    <ul id="list">
      <li id="item1">Item 1</li>
      <li id="item2">Item 2</li>
      <li id="item3">Item 3</li>
    </ul>
  </div>

  <!-- External JS -->
  <script src="script2.js"></script>
</body>
</html>
