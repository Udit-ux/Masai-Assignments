<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Manipulation - Add List Items</title>
  <style>
    .odd {
      font-weight: bold;
      color: blue;
    }

    .even {
      font-style: italic;
      color: red;
    }
  </style>
</head>
<body>

  <h1>Item List</h1>

  <ul id="item-list">
    <li class="odd">Item 1</li>
    <li class="even">Item 2</li>
    <li class="odd">Item 3</li>
  </ul>

  <button id="add-button">Add Item</button>

  <script src="script2.js"></script>
</body>
</html>
