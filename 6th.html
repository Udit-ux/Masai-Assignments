<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fetch Users</title>
</head>
<body>
  <h1>Open console to see user names</h1>

  <script>
    // Fetch user data from API and log names
    fetch("https://jsonplaceholder.typicode.com/users")
      .then(response => response.json())
      .then(users => {
        users.forEach(user => {
          console.log(user.name);
        });
      })
      .catch(error => {
        console.error("Error fetching users:", error);
      });
  </script>
</body>
</html>
