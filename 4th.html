<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debugged Form</title>
</head>
<body>

    <form action="/submit">
        <!-- Username Field -->
        <label for="username">Enter Username:</label>
        <input type="text" id="username" name="username"><br><br>

        <!-- Password Field -->
        <label for="passcode">Password:</label>
        <input type="password" id="passcode" name="password"><br><br>

        <!-- Submit Button -->
        <button type="submit">Submit Form</button>
    </form>

</body>
</html>
