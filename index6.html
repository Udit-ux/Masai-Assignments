<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Display Properties</title>
  <link rel="stylesheet" href="style6.css">
</head>
<body>
  <h1>CSS Display Property Demonstration</h1>
  <p>This example shows how different CSS display properties behave.</p>

  <div id="block-element">Block Element (Takes full width)</div>
  
  <span id="inline-element">Inline Element</span>
  
  <div id="inline-block-element">Inline-Block Element</div>
  
  <div id="hidden-element">This element is hidden using display: none</div>
  
  <button onclick="toggleHidden()">Toggle Hidden Element</button>

  <script src="script.js"></script>
</body>
</html>
