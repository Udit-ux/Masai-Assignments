<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App with Pagination</title>
  <style>
    .todo {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
    }
    .completed {
      background-color: #e0ffe0;
    }
    #pagination {
      margin-top: 20px;
    }
    #pagination button {
      margin: 2px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <h1>Todo App with Pagination</h1>
  <div id="todos"></div>
  <div id="pagination"></div>

  <script src="script.js"></script>
</body>
</html>
