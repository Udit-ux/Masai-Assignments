<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    input {
      padding: 8px;
      width: 200px;
    }

    button {
      padding: 8px 12px;
      margin-left: 5px;
    }

    li {
      margin: 10px 0;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }

    .task-btn {
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <h1>Dynamic To-Do List</h1>

  <input type="text" id="taskInput" placeholder="Enter a task">
  <button id="addTaskBtn">Add Task</button>

  <ul id="taskList"></ul>

  <script src="script5.js"></script>
</body>
</html>
