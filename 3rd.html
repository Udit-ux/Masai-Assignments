<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery with Links</title>
</head>
<body>

    <h1>My Image Gallery</h1>

    <!-- Image 1 -->
    <section>
        <img src="https://via.placeholder.com/300x200" alt="Mountain Landscape" width="300" height="200">
        <p>
            <a href="https://en.wikipedia.org/wiki/Mountain" target="_blank">
                Learn more about mountains
            </a>
        </p>
    </section>

    <!-- Image 2 -->

        <p>
            <a href="https://en.wikipedia.org/wiki/Ocean" target="_blank">
                Learn more about oceans
            </a>
        </p>
    </section>

    <!-- Image 3 -->
    <section>
        <img src="https://via.placeholder.com/300x200" alt="Forest Path" width="300" height="200">
        <p>
            <a href="https://en.wikipedia.org/wiki/Forest" target="_blank">
                Learn more about forests
            </a>
        </p>
    </section>

</body>
</html>
