<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Listing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #error {
      color: red;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 16px;
      height: 40px;
      overflow: hidden;
    }

    .card p {
      font-weight: bold;
      margin: 10px 0;
    }

    .card button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .card button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Product Listing</h1>
  <div id="error"></div>
  <div id="product-container" class="grid"></div>

  <script>
    const productContainer = document.getElementById("product-container");
    const errorDiv = document.getElementById("error");

    // Fetch product data from the API
    async function fetchProducts() {
      try {
        const response = await fetch("https://fakestoreapi.com/products");

        // Check for response errors
        if (!response.ok) {
          throw new Error("HTTP error! Status: " + response.status);
        }

        const products = await response.json();
        displayProducts(products);
      } catch (error) {
        // Handle any error from fetch or parsing
        console.error("Fetch error:", error);
        errorDiv.textContent = "Failed to fetch products. Please try again later.";
      }
    }

    // Display products dynamically in cards
    function displayProducts(products) {
      productContainer.innerHTML = ""; // Clear container

      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${product.image}" alt="${product.title}" />
          <h3>${product.title}</h3>
          <p>$${product.price}</p>
          <button onclick="alert('Product ID: ${product.id}')">View Details</button>
        `;

        productContainer.appendChild(card);
      });
    }

    // Load products when the page is ready
    window.onload = fetchProducts;
  </script>
</body>
</html>
